name: Deploy to GitHub Pages (MkDocs + Quarto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# ============================================================
# Quarto のレンダリングはローカルで実施してコミットする運用。
# CI は MkDocs のビルド・デプロイのみを担当。
#
# 【ローカル更新手順】
#   1. quarto render quarto/   → docs/quarto/ に HTML + PDF を生成
#   2. git add docs/quarto/
#   3. git commit && git push  → CI が GitHub Pages にデプロイ
# ============================================================

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs mkdocs-material mkdocs-with-pdf
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      # docs/quarto/ は git 管理済み（ローカルで quarto render して commit）
      # CI は MkDocs でそのまま静的ファイルとして同梱してデプロイする
      - name: Build and deploy MkDocs (includes docs/quarto/)
        run: mkdocs gh-deploy --force --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Quarto PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarto-pdf
          path: docs/quarto/*.pdf
          if-no-files-found: warn
