name: Deploy to GitHub Pages (MkDocs + Quarto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── MkDocs 依存インストール ──────────────────────────
      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs mkdocs-material mkdocs-with-pdf
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      # ── Quarto セットアップ ──────────────────────────────
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # TinyTeX (LuaLaTeX) をインストール

      # ── TinyTeX を PATH に追加 ───────────────────────────
      # quarto-actions が GITHUB_PATH に書き込まない場合の対策
      - name: Add TinyTeX to PATH
        run: |
          TINYTEX_BIN=$(find "$HOME" -name tlmgr -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
          if [ -n "$TINYTEX_BIN" ]; then
            echo "Found TinyTeX at: $TINYTEX_BIN"
            echo "$TINYTEX_BIN" >> "$GITHUB_PATH"
          else
            echo "::warning::tlmgr not found — TinyTeX may not be installed"
          fi

      # ── 日本語 PDF サポート ──────────────────────────────
      - name: Install Japanese font and LaTeX packages
        run: |
          # 日本語システムフォント（Noto CJK）
          sudo apt-get install -y fonts-noto-cjk
          # bxjsarticle (documentclass) + LuaTeX-ja (日本語組版)
          tlmgr install bxjscls luatexja

      # ── Quarto レンダリング（HTML + PDF 同時生成）────────
      - name: Render Quarto (HTML + PDF → docs/quarto/)
        run: quarto render quarto/

      # ── MkDocs デプロイ（docs/quarto/ を静的ファイルとして同梱）──
      - name: Build and deploy MkDocs
        run: mkdocs gh-deploy --force --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── アーティファクト保存 ─────────────────────────────
      - name: Upload Quarto PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarto-pdf
          path: docs/quarto/*.pdf
          if-no-files-found: warn
