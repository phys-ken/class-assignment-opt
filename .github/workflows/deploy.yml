name: Deploy to GitHub Pages (MkDocs + Quarto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── MkDocs 依存インストール ──────────────────────────
      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs mkdocs-material mkdocs-with-pdf
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      # ── Quarto セットアップ（TinyTeX は使わない）──────────
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # tinytex は使用しない: 代わりにシステム texlive を使用

      # ── システム TeX Live + 日本語サポート ──────────────
      # texlive-luatex: lualatex エンジン
      # texlive-lang-japanese: luatexja + 日本語 TeX
      # texlive-latex-extra: bxjscls (bxjsarticle) を含む
      # fonts-noto-cjk: Noto CJK フォント（LuaLaTeX が参照）
      - name: Install LaTeX (system texlive) and Japanese support
        run: |
          sudo apt-get install -y \
            texlive-luatex \
            texlive-lang-japanese \
            texlive-latex-extra \
            fonts-noto-cjk

      # ── Quarto レンダリング（HTML + PDF 同時生成）────────
      # docs/quarto/ には git commit 済みの PDF があるため、
      # PDF 生成に失敗してもデプロイは継続する
      - name: Render Quarto (HTML + PDF → docs/quarto/)
        run: |
          quarto render quarto/ || {
            echo "::warning::quarto render failed — using committed docs/quarto/ files"
          }

      # ── MkDocs デプロイ（docs/quarto/ を静的ファイルとして同梱）──
      - name: Build and deploy MkDocs
        run: mkdocs gh-deploy --force --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── アーティファクト保存 ─────────────────────────────
      - name: Upload Quarto PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarto-pdf
          path: docs/quarto/*.pdf
          if-no-files-found: warn
